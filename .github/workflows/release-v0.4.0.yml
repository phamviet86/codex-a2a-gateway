name: Publish v0.4.0

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-v0.4.0
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(github.event.workflow_run.head_commit.message, '[release v0.4.0]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      # Keep the already-created annotated tag on its tested source commit.
      RELEASE_SHA: 2b022152a9f85a23afa572cb5e6d10fe7dd10b37
      WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify version and build tested commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "$WORKFLOW_SHA"
          mkdir "$RUNNER_TEMP/release-source"
          git archive "$RELEASE_SHA" | tar -x -C "$RUNNER_TEMP/release-source"
          cd "$RUNNER_TEMP/release-source"
          python -c 'import tomllib; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == "0.4.0"'
          python -m pip install -e '.[dev]'
          python -m build
          python -m twine check dist/*
          python scripts/check_dist.py dist
          python scripts/check_wheel_install.py dist/*.whl
          python scripts/write_sha256sums.py dist
          python scripts/write_sha256sums.py --check dist
      - name: Tag, upload, download-verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release-source"
          python "$GITHUB_WORKSPACE/scripts/publish_v040.py"
