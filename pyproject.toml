[build-system]
requires = ["hatchling>=1.26,<1.28"]
build-backend = "hatchling.build"

[project]
name = "codex-a2a-gateway"
version = "0.2.0"
description = "Bidirectional A2A v1.0 gateway for Codex with MCP and App Server adapters"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Codex A2A Gateway contributors"}]
keywords = ["a2a", "codex", "hermes-agent", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2.0,<3",
  "pydantic>=2.10,<3",
  "starlette>=1.6,<2",
  "uvicorn>=0.52,<1",
]

[project.urls]
Homepage = "https://github.com/phamviet86/codex-a2a-gateway"
Documentation = "https://github.com/phamviet86/codex-a2a-gateway/tree/main/docs"
Source = "https://github.com/phamviet86/codex-a2a-gateway"
Issues = "https://github.com/phamviet86/codex-a2a-gateway/issues"
Changelog = "https://github.com/phamviet86/codex-a2a-gateway/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "ruff>=0.9,<1",
  "twine>=6,<7",
]

[project.scripts]
codex-a2a-gateway = "codex_a2a_gateway.cli:main"
codex-hermes-a2a-bridge = "codex_a2a_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_a2a_gateway"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/.editorconfig",
  "/.env.example",
  "/LICENSE",
  "/README.md",
  "/README.vi.md",
  "/SECURITY.md",
  "/docs",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
]
exclude = [
  "/.github",
  "/.venv",
  "/dist",
  "**/.DS_Store",
  "**/__pycache__",
  "**/*.pyc",
  "**/*.sqlite*",
  "**/*.log",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["codex_a2a_gateway"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
